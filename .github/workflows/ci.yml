name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prisma client must exist before the server typecheck
      - name: Generate Prisma client
        run: bun run --cwd server db:generate

      - name: Typecheck server
        run: bun run --cwd server typecheck
      - name: Typecheck admin
        run: bun run --cwd admin typecheck
      - name: Typecheck client2
        run: bun run --cwd client2 typecheck

      # NOTE: `bun run lint` is intentionally not run here. ESLint currently
      # cannot resolve `@typescript-eslint/eslint-plugin` from bun's package
      # store in this monorepo, so every workspace's lint errors out. Re-add a
      # "Lint" step once that resolution is fixed.
