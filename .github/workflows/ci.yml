name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Server (Prisma client must exist before tsc)
      - name: Generate Prisma client
        run: bun --cwd server run db:generate

      - name: Typecheck server
        run: bun --cwd server run typecheck
      - name: Typecheck admin
        run: bun --cwd admin run typecheck
      - name: Typecheck client2
        run: bun --cwd client2 run typecheck

      - name: Lint server
        run: bun --cwd server run lint
      - name: Lint admin
        run: bun --cwd admin run lint
      - name: Lint client2
        run: bun --cwd client2 run lint
